[project]
name = "mojo-category-encoders"
version = "0.1.0"
description = "Target, hashing, and ordinal category encoders accelerated with Mojo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
dependencies = ["numpy", "pandas", "scikit-learn"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::pandas.errors.Pandas4Warning"]
